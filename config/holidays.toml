# NSE equity-segment trading holidays. Refresh every December from the NSE
# circular ("Holidays" under nseindia.com > Resources > Exchange communication).
#
# The engine refuses to start on a date whose year is not listed in `years`,
# so a stale file fails safe (no trading) instead of trading on a holiday.
#
# Weekend holidays are omitted: weekends are always closed.
# Special sessions (e.g. Muhurat trading on Sun 2026-11-08) are NOT traded.

years = [2026]

