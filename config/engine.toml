# Saarthi engine configuration. Not secret; safe to commit per deployment.
# Hard trading limits live in risk.toml; credentials live in secrets.env.

# backtest | paper | live. Used by the engine from M3; live stays off until the M5 gate.
mode = "paper"

[paths]
data_dir = "data"
universe = "config/universe.toml"
holidays = "config/holidays.toml"

[smartapi]
base_url = "https://apiconnect.angelone.in"
instruments_url = "https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"
# SmartAPI documents 3 req/s for historical data. Requests are evenly spaced.
historical_requests_per_sec = 2.0
requests_per_sec = 5.0
max_retries = 5
retry_base_delay_ms = 1000
timeout_secs = 30
# Sent with every request. For live orders the public IP must be the static
# IP registered with Angel One (SEBI retail-algo framework).
client_local_ip = "127.0.0.1"
client_public_ip = "127.0.0.1"
mac_address = "00:00:00:00:00:00"

# Live market data: SmartAPI WebSocket 2.0.
[feed]
url = "wss://smartapisocket.angelone.in/smart-stream"
# Text "ping" heartbeat; Angel closes connections silent for 30 s.
heartbeat_ms = 25000
# Reconnect if nothing at all (not even "pong") arrives for this long.
read_timeout_ms = 70000
connect_timeout_ms = 10000
# Exponential backoff with jitter between reconnect attempts.
reconnect_initial_ms = 500
reconnect_max_ms = 30000
# ARCHITECTURE §7: no ticks for 10 s in market hours blocks new entries;
# 120 s with open positions means flatten.
stale_warn_ms = 10000
stale_critical_ms = 120000
# Angel allows 1000 token subscriptions per connection.
max_tokens = 1000
# Send "Authorization: Bearer <jwt>"; set false to send the bare JWT.
bearer_prefix = true

[bars]
# fold_into_open: the 09:08 pre-open auction trade counts in the 09:15 bar.
# ignore: pre-open trades only set the volume baseline. Run
# `feedcheck compare` once each way to see which matches Angel's candles.
pre_open = "fold_into_open"
# How long a bar waits for late ticks after its minute ends.
close_grace_ms = 2000
higher = ["5m"]

# The trading loop (M3). SAARTHI_MODE overrides `mode` above.
[engine]
risk = "config/risk.toml"
costs = "config/costs.toml"
# Strategies allowed to trade. Paper trading runs all three so you can watch
# them; for live, keep only those that passed the M2 gate on real data.
strategies = ["orb", "vwap_revert", "momentum"]
# Subset of the universe to trade; empty = all of universe.toml.
symbols = []
direction = "both"
# Starting cash of a new paper account, in rupees.
paper_capital_inr = 1000000
# Days of 5m candles from data/ used to warm up indicators.
warmup_days = 5
sync_secs = 1
reconcile_secs = 30
square_off_retry_secs = 5
square_off_alert_after = 3
# The daemon exits at this IST time once flat.
stop_at = "15:35"
# Kill switch: this file in data/accounts/<client>/paper/ halts and flattens.
halt_file = "HALT"

[engine.indicators]
tf = "5m"
