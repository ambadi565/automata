[project]
name = "saarthi-strategist"
version = "0.1.0"
description = "Saarthi's Claude strategist: reads the market and writes the plan the engine follows. It cannot place orders."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "feedparser>=6.0",
    "polars>=1.0",
    "jsonschema[format]>=4.22",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
saarthi-strategist = "saarthi_strategist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saarthi_strategist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
